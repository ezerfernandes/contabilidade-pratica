<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stick Scene Gallery</title>
<meta name="description" content="Every stick-figure scene made with /stick-scene, for teaching, ideas, product UI, developer tools and everyday life.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
.g-head { padding-block: 56px 28px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 20px; }
.g-head h1 { font-size: clamp(38px, 5.6vw, 64px); line-height: 1; letter-spacing: -.045em; font-weight: 500; margin: 10px 0 0; }
.g-head p { margin: 12px 0 0; color: var(--body); max-width: 560px; font-size: 17px; }
.tools { position: sticky; top: calc(60px + env(safe-area-inset-top, 0px)); z-index: 10; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.tools-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 12px; }
.tools .chips { flex: 1; }
.search { position: relative; flex: 0 1 260px; min-width: 180px; }
.search input { width: 100%; height: 36px; border-radius: 10px; border: 1px solid var(--line-strong); padding: 0 12px 0 34px; font: 14px var(--sans); background: #fff; }
.search input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
.search svg { position: absolute; left: 11px; top: 11px; width: 14px; height: 14px; color: var(--muted); }
.results { padding-block: 26px 80px; }
.cat-block + .cat-block { margin-top: 44px; }
.cat-block h2 { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 500; letter-spacing: -.025em; margin: 0 0 14px; }
.cat-block h2 span.n { font-family: var(--mono); font-size: 12px; color: var(--muted); font-weight: 400; }
.empty { padding: 60px 0; text-align: center; color: var(--muted); }
.random { margin-left: auto; }
</style>
</head>
<body>
<header data-nav></header>
<main>
  <div class="wrap g-head">
    <div>
      <div class="eyebrow">Gallery</div>
      <h1><span data-count></span> scenes, and counting</h1>
      <p>Hover a scene to play it. Click to open it big, scrub through it frame by frame and copy the one-line prompt that makes it.</p>
    </div>
    <button type="button" class="btn ghost" data-random>Surprise me</button>
  </div>
  <div class="tools">
    <div class="wrap tools-in">
      <div class="chips" data-filters></div>
      <label class="search"><span class="muted" style="position:absolute;width:1px;height:1px;overflow:hidden">Search scenes</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg><input id="q" type="search" placeholder="Search: pizza, auth, rain…" data-q></label>
    </div>
  </div>
  <div class="wrap results" data-results></div>
</main>
<footer data-foot></footer>

<script src="assets/catalog.js"></script>
<script src="assets/site.js"></script>
<script>
  const { CATALOG, CATEGORIES } = window;
  const S = window.SITE;
  S.renderChrome('gallery');
  S.loadScenes(window.sceneFiles());
  for (const el of document.querySelectorAll('[data-count]')) {
    el.textContent = CATALOG.length;
  }
  const lb = S.lightbox();
  let filter = 'all', q = '';
  const filters = document.querySelector('[data-filters]');
  const count = (id) => (id === 'all' ? CATALOG.length : CATALOG.filter((s) => s.cat === id).length);
  const chip = (id, name) => `<button type="button" class="chip" data-f="${id}" aria-pressed="${id === filter}">${id === 'all' ? '' : `<span class="dot ${id}"></span>`}${name}<span class="n">${count(id)}</span></button>`;
  filters.innerHTML = chip('all', 'All') + CATEGORIES.map((c) => chip(c.id, c.name)).join('');

  function visible() {
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    return CATALOG.filter((s) => {
      if (filter !== 'all' && s.cat !== filter) {
        return false;
      }
      const hay = `${s.title} ${s.blurb} ${S.catName[s.cat]}`.toLowerCase();
      return words.every((w) => hay.includes(w));
    });
  }

  function render() {
    const root = document.querySelector('[data-results]');
    const list = visible();
    const ids = list.map((s) => s.id);
    root.replaceChildren();
    if (!list.length) {
      root.innerHTML = `<p class="empty">No scene for "${q.replace(/</g, '&lt;')}" yet. That's a good one to ask your agent for.</p>`;
      return;
    }
    const groups = filter === 'all' && !q ? CATEGORIES : [{ id: '_', name: '' }];
    for (const g of groups) {
      const items = g.id === '_' ? list : list.filter((s) => s.cat === g.id);
      if (!items.length) {
        continue;
      }
      const block = document.createElement('div');
      block.className = 'cat-block';
      if (g.name) {
        block.innerHTML = `<h2><span class="dot ${g.id}"></span>${g.name}<span class="n">${items.length}</span></h2>`;
      }
      const grid = document.createElement('div');
      grid.className = 'grid';
      for (const s of items) {
        const t = S.tile(s);
        t.addEventListener('click', () => lb.open(s.id, ids));
        grid.appendChild(t);
      }
      block.appendChild(grid);
      root.appendChild(block);
    }
  }

  function setFilter(id) {
    filter = id;
    for (const b of filters.querySelectorAll('[data-f]')) {
      b.setAttribute('aria-pressed', String(b.dataset.f === id));
    }
    render();
  }

  for (const b of filters.querySelectorAll('[data-f]')) {
    b.addEventListener('click', () => setFilter(b.dataset.f));
  }
  document.querySelector('[data-q]').addEventListener('input', (e) => {
    q = e.target.value;
    render();
  });
  document.querySelector('[data-random]').addEventListener('click', () => {
    const list = visible();
    const pick = list[Math.floor(Math.random() * list.length)];
    if (pick) {
      lb.open(pick.id, list.map((s) => s.id));
    }
  });

  const hash = decodeURIComponent(location.hash.slice(1));
  if (CATEGORIES.some((c) => c.id === hash)) {
    setFilter(hash);
  } else {
    render();
    if (S.byId[hash]) {
      lb.open(hash, CATALOG.map((s) => s.id));
    }
  }
</script>
</body>
</html>
